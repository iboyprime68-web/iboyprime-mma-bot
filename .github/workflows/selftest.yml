name: Selftests
on:
  push:
    paths:
      - '**.py'
      - 'commands_worker/**'
      - 'quiz_data.json'
      - 'debates_data.json'
      - 'onthisday_data.json'
      - 'modconfig.json'
      - 'newsconfig.json'
      - 'welcomeconfig.json'
      - 'bots_config.json'
  workflow_dispatch:
permissions:
  contents: read
# NO concurrency group on purpose (Aug 2026). It used to be `group: selftest,
# cancel-in-progress: true`, which meant every superseded run was CANCELLED - and
# GitHub mails "Run failed: All jobs were cancelled" for a cancelled run exactly
# like a real failure. On Aug 4 that alone sent the owner 16 emails in one day,
# because a deploy dispatches this workflow and he deployed several times. The
# group only ever saved Actions minutes, which are free and unlimited on a public
# repo, so it was buying nothing and costing the inbox. Two short read-only jobs
# running twice over harm nothing; a cancelled run does.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mocked selftests
        run: python selftest_changes.py
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install worker deps (pinned by package-lock.json)
        # worker.js seals the AI key with libsodium (tweetnacl + blakejs), so
        # the suite needs them present. npm ci installs the EXACT locked
        # versions - never a floating install in CI.
        run: cd commands_worker && npm ci --no-audit --no-fund
      - name: Worker syntax + unit tests
        run: |
          node --check commands_worker/worker.js
          cd commands_worker && node worker.test.js
