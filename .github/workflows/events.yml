name: Auto Scheduled Events
on:
  schedule:
    - cron: '7 */6 * * *'   # every 6 hours (offset to stagger from other bots)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-events
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create/refresh Discord scheduled events
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python events_bot.py
      - name: Save state
        run: |
          git config user.name "iboyprime-bot"
          git config user.email "bot@users.noreply.github.com"
          # The bot that just ran is the only writer of state_events.json, so its output wins
          # outright. Never merge it: `git pull --autostash` used to pop a conflicting
          # stash and the blind `git add` below committed the <<<<<<< markers, which
          # broke state_raid.json permanently (raid detection went dead, silently).
          mkdir -p /tmp/keep && cp state_events.json /tmp/keep/ 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git pull --rebase || true
          cp /tmp/keep/* . 2>/dev/null || true
          if grep -lE '^(<{7}|={7}|>{7})' state_events.json 2>/dev/null; then
            echo "::error::conflict markers in state - refusing to commit"; exit 1
          fi
          git add state_events.json 2>/dev/null || true
          git commit -m "events state [skip ci]" || echo "no changes"
          git push || true
