name: Config Snapshot
on:
  schedule:
    - cron: '23 4 * * *'   # nightly; commits only on real config drift
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-snapshot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture the nightly config snapshot + member count
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python snapshot_bot.py
      - name: Save state
        run: |
          git config user.name "iboyprime-bot"
          git config user.email "bot@users.noreply.github.com"
          # The bot that just ran is the only writer of snapshot_config.json state_snapshot.json, so its output wins
          # outright. Never merge it: `git pull --autostash` used to pop a conflicting
          # stash and the blind `git add` below committed the <<<<<<< markers, which
          # broke state_raid.json permanently (raid detection went dead, silently).
          mkdir -p /tmp/keep && cp snapshot_config.json state_snapshot.json /tmp/keep/ 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git pull --rebase || true
          cp /tmp/keep/* . 2>/dev/null || true
          if grep -lE '^(<{7}|={7}|>{7})' snapshot_config.json state_snapshot.json 2>/dev/null; then
            echo "::error::conflict markers in state - refusing to commit"; exit 1
          fi
          git add snapshot_config.json state_snapshot.json 2>/dev/null || true
          git commit -m "config snapshot [skip ci]" || echo "no changes"
          git push || true
