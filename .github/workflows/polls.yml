name: YouTube Poll Staging
on:
  schedule:
    - cron: '23 9,16 * * *'   # TWICE a day (owner ask, Aug 19 2026): a morning
                              # and an evening slot, one staged poll each. The
                              # same-slot guard in polls_bot makes re-runs and
                              # manual dispatches safe.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-polls
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render deps (pinned; non-fatal)
        # Pillow powers the 640x640 option tiles (postcard.py). If this step
        # ever fails the poll must still stage - polls_bot degrades to a
        # text-only stage and the job stays green; a red cron run emails the
        # owner.
        run: pip install -r requirements-post.txt || echo "Pillow install failed - staging without tiles this run"
      - name: Stage one YouTube poll to the studio channel
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # One line per scorer.PROVIDERS entry, same as news.yml: pollgen
          # writes the poll with whichever key is set (DeepSeek first) and
          # falls back to the curated bank with none. An unset secret expands
          # to an empty string, which scorer.provider() reads as "no key".
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python polls_bot.py
      - name: Save state
        run: |
          git config user.name "iboyprime-bot"
          git config user.email "bot@users.noreply.github.com"
          # The bot that just ran is the only writer of state_polls.json, so its output wins
          # outright. Never merge it: `git pull --autostash` used to pop a conflicting
          # stash and the blind `git add` below committed the <<<<<<< markers, which
          # broke state_raid.json permanently (raid detection went dead, silently).
          mkdir -p /tmp/keep && cp state_polls.json /tmp/keep/ 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git pull --rebase || true
          cp /tmp/keep/* . 2>/dev/null || true
          if grep -lE '^(<{7}|={7}|>{7})' state_polls.json 2>/dev/null; then
            echo "::error::conflict markers in state - refusing to commit"; exit 1
          fi
          git add state_polls.json 2>/dev/null || true
          git commit -m "polls state [skip ci]" || echo "no changes"
          git push || true
