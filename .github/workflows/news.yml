name: MMA News Wire
on:
  schedule:
    - cron: '4 * * * *'      # HOURLY, at :04. One tick starts one ~55-min window (news_bot
                             # WINDOW_SECONDS=3300) which ends around :59, and the next tick
                             # lands after it. Inside the window feeds are checked every ~20s,
                             # so posts are still near-instant.
                             #
                             # This was */5 until Aug 2026 and that is what flooded the owner's
                             # inbox. A tick landing mid-window leaves a PENDING run, and GitHub
                             # cancels the pending run as soon as a third tick arrives - mailing
                             # "Run failed: All jobs were cancelled" each time (10 in one day).
                             # Never point a cron shorter than the window at this workflow.
  workflow_dispatch:
    inputs:
      reason:
        description: 'What triggered this run (doorbell | manual)'
        required: false
        default: 'manual'
permissions:
  contents: write
concurrency:
  group: bot-news
  cancel-in-progress: false
  # queue: max (GitHub Actions, May 2026) allows up to 100 QUEUED runs per group
  # and cancels none of them. Without it a group keeps exactly one pending run
  # and CANCELS that pending run the moment a newer one arrives - and GitHub
  # mails "Run failed: All jobs were cancelled" for it, worded and weighted
  # exactly like a real failure. That single line is what makes it safe for this
  # workflow to be triggered more often than it finishes, which is the whole
  # premise of moving the trigger off GitHub's throttled scheduler.
  # It may NOT be combined with cancel-in-progress: true (validation error).
  queue: max
jobs:
  run:
    runs-on: ubuntu-latest
    # The window is 3300s (55 min) plus ~90s of runner setup. Without a timeout
    # GitHub's default is 360 MINUTES, so a job wedged on a hanging feed would sit
    # on the `bot-news` concurrency group for six hours, cancelling every pending
    # tick behind it and mailing the owner for each one. 58 (Sept 24 2026, was 56)
    # leaves the last cycle room to finish its staging and write its state:
    # 56 left about 30s after setup, and a job killed mid-cycle re-posts that
    # cycle's story on the next run. `queue: max` means a slightly longer run
    # delays the next one instead of cancelling it.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # the render deps now include OpenCV (~50 MB) for face framing;
          # the wheel cache keeps every run after the first off PyPI
          cache: 'pip'
          cache-dependency-path: requirements-post.txt
      - name: Install render deps (pinned; non-fatal)
        # Pillow powers the staged-post graphics (postcard.py); numpy + OpenCV
        # find the faces photopick frames on. If this step ever fails, news
        # delivery must NOT: ytposts stages text-only (or with the old framing)
        # and the job stays green - a failing hourly job would email the owner
        # hourly.
        run: pip install -r requirements-post.txt || echo "render deps install failed - staging degrades this run"
      - name: Poll MMA feeds and post new articles
        env:
          NEWS_REASON: ${{ inputs.reason || 'schedule' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # One line per scorer.PROVIDERS entry. An unset secret expands to an
          # empty string, which scorer.provider() reads as "no key", so listing
          # all seven costs nothing and means adding a key is a deploy, not a
          # workflow edit.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python news_bot.py
      - name: Save state
        run: |
          git config user.name "iboyprime-bot"
          git config user.email "bot@users.noreply.github.com"
          # The bot that just ran is the only writer of state_news.json, so its output wins
          # outright. Never merge it: `git pull --autostash` used to pop a conflicting
          # stash and the blind `git add` below committed the <<<<<<< markers, which
          # broke state_raid.json permanently (raid detection went dead, silently).
          mkdir -p /tmp/keep && cp state_news.json /tmp/keep/ 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git pull --rebase || true
          cp /tmp/keep/* . 2>/dev/null || true
          if grep -lE '^(<{7}|={7}|>{7})' state_news.json 2>/dev/null; then
            echo "::error::conflict markers in state - refusing to commit"; exit 1
          fi
          git add state_news.json 2>/dev/null || true
          git commit -m "news state [skip ci]" || echo "no changes"
          git push || true
